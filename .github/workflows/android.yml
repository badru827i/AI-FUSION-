name: AI-FUSION Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Print debug signing SHA-1
        run: |
          gradle --no-daemon :app:signingReport
          echo "Google OAuth Android client must use package: com.aifusion.app"
          echo "Use the SHA-1 shown under Variant: debug for the APK built by this workflow."

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ai-fusion-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
