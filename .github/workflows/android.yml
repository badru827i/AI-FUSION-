name: AI-FUSION Android

# CI verification trigger for Google Sign-In fix
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Print debug signing SHA-1
        run: |
          gradle --no-daemon :app:signingReport
          echo "Google OAuth Android client package: com.aifusion.app"
          echo "IMPORTANT: register this DEBUG SHA-1 in Google Cloud Console for the Android OAuth client."
          echo "The Credential Manager serverClientId must be a WEB application OAuth client ID."
          echo "The Web OAuth client ID is injected from the GitHub Actions secret at build time."
          echo "No Google OAuth client secret is included in the APK."

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ai-fusion-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
